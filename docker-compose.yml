services:
  finance-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_personal_finance_tracker
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/finance.db
    restart: unless-stopped
    volumes:
      - finance-data:/app/data

volumes:
  finance-data:
